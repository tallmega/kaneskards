name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The project intentionally has no local Gradle installation or wrapper.
      # This downloads Gradle only on GitHub's build runner.
      - name: Download Gradle
        run: |
          curl --fail --silent --show-error --location \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        run: /tmp/gradle-8.11.1/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kanes-Kards-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
